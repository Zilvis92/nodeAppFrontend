<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naujienų Portalas | Redaguoti naujieną</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav>
        <div class="site-title">
            <a href="index.html"><h1>Mano tinklarastis</h1></a>
            <p>Naujienos</p>
        </div>
        <ul>
            <li><a href="index.html">Naujienos</a></li>
            <li><a href="apie.html">Apie</a></li>
            <li class="user-element" style="display: none;">
                <div class="user-info">
                    <span class="user-avatar"></span>
                    <span class="user-name"></span>
                </div>
            </li>
            <li class="user-element" style="display: none;">
                <a href="#" id="logout-btn">Atsijungti</a>
            </li>
        </ul>
    </nav>

    <div class="auth-content">
        <h2>Redaguoti naujieną</h2>
        
        <div id="message-container"></div>
        <div id="loading-message">⏳ Kraunama naujiena...</div>
        
        <form id="edit-blog-form" class="auth-form" style="display: none;">
            <div class="form-group">
                <label for="title">Naujienos pavadinimas</label>
                <input type="text" id="title" name="title" placeholder="Įveskite naujienos pavadinimą" required>
            </div>
            
            <div class="form-group">
                <label for="santrauka">Santrauka</label>
                <input type="text" id="santrauka" name="santrauka" placeholder="Trumpa naujienos santrauka" required>
            </div>
            
            <div class="form-group">
                <label for="body">Turinys</label>
                <textarea id="body" name="body" rows="10" placeholder="Naujienos turinys..." required></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="auth-button">Atnaujinti naujieną</button>
                <a href="#" id="cancel-button" class="cancel-button">Atšaukti</a>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 Visos teisės saugomos.</p>
    </footer>

    <script src="../js/api.js" type="module"></script>
    <script src="../js/auth.js" type="module"></script>
    <script src="../js/main.js" type="module"></script>
    <script src="../js/edit-blog.js" type="module"></script>
</body>
</html>
