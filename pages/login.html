<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naujienų Portalas | Prisijungti</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav>
        <div class="site-title">
            <a href="index.html"><h1>Mano tinklarastis</h1></a>
            <p>Naujienos</p>
        </div>
        <ul>
            <li><a href="index.html">Naujienos</a></li>
            <li><a href="apie.html">Apie</a></li>
            <li><a href="login.html">Prisijungti</a></li>
            <li><a href="register.html">Registruotis</a></li>
        </ul>
    </nav>

    <div class="auth-content">
        <h2>Prisijungimas</h2>
        <div id="message-container"></div>
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="email">El. paštas</label>
                <input type="email" id="email" name="email" placeholder="Įveskite savo el. paštą" required>
            </div>
            <div class="form-group">
                <label for="password">Slaptažodis</label>
                <input type="password" id="password" name="password" placeholder="Įveskite savo slaptažodį" required>
            </div>
            <button type="submit" class="auth-button">Prisijungti</button>
            <div class="auth-link">
                <p>Neturite paskyros? <a href="register.html">Registruokitės čia</a></p>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 Visos teisės saugomos.</p>
    </footer>

    <!-- TIK ŠIE SCRIPT FAILAI -->
    <script src="../js/api.js" type="module"></script>
    <script src="../js/auth.js" type="module"></script>
    <script src="../js/login.js" type="module"></script>
</body>
</html>
